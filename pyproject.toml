[project]
name = "dataanalyst"
version = "0.1.0"
description = "E-commerce sales performance analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "kagglehub>=1.0.2",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataanalyst"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
